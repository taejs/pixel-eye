name: Pixel verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Rebuild and verify the public example
        run: |
          python pixel_eye.py examples/eye-16.png eye-rebuilt.svg
          python verify_pixels.py examples/eye-16.png eye-rebuilt.svg
          cmp examples/eye-16.svg eye-rebuilt.svg
